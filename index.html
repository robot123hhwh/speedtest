<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>speedtest // robot123.xyz</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #111114;
      --border: #222228;
      --text: #f4f4f5;
      --muted: #71717a;
      --accent: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 540px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      font-size: 13px;
      color: var(--muted);
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 8px;
    }
    .main-readout {
      text-align: center;
      padding: 20px 0 32px;
    }
    .phase {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .speed-value {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .speed-unit {
      font-size: 15px;
      color: var(--muted);
      margin-top: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .stat-num {
      font-size: 20px;
      font-weight: 600;
    }
    .bar-wrap {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.15s linear;
    }
    button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #09090b;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div><span class="status-dot"></span>speedtest.robot123.xyz</div>
      <div id="edge-node">EDGE: AUTO</div>
    </div>

    <div class="main-readout">
      <div class="phase" id="phase">READY</div>
      <div class="speed-value" id="live-speed">0.0</div>
      <div class="speed-unit" id="live-unit">Mbps</div>
    </div>

    <div class="bar-wrap"><div class="bar" id="progress"></div></div>

    <div class="grid">
      <div class="stat">
        <div class="stat-label">Download</div>
        <div class="stat-num" id="dl-res">— Mbps</div>
      </div>
      <div class="stat">
        <div class="stat-label">Upload</div>
        <div class="stat-num" id="ul-res">— Mbps</div>
      </div>
      <div class="stat">
        <div class="stat-label">Ping</div>
        <div class="stat-num" id="ping-res">— ms</div>
      </div>
      <div class="stat">
        <div class="stat-label">Jitter</div>
        <div class="stat-num" id="jitter-res">— ms</div>
      </div>
    </div>

    <button id="start-btn" onclick="runTest()">START TEST</button>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    async function detectEdge() {
      try {
        const res = await fetch("/cdn-cgi/trace");
        const txt = await res.text();
        const colo = txt.match(/colo=([A-Z]+)/);
        if (colo) $("edge-node").textContent = `EDGE: ${colo[1]}`;
      } catch {}
    }
    detectEdge();

    async function measurePing(samples = 10) {
      $("phase").textContent = "PING & JITTER";
      $("live-unit").textContent = "ms";
      const times = [];

      // Warmup request
      await fetch(`/api/speed?mode=ping&t=${Date.now()}`, { cache: "no-store" });

      for (let i = 0; i < samples; i++) {
        const t0 = performance.now();
        await fetch(`/api/speed?mode=ping&t=${Date.now()}-${i}`, { cache: "no-store" });
        const rtt = performance.now() - t0;
        times.push(rtt);
        $("live-speed").textContent = rtt.toFixed(1);
        $("progress").style.width = `${((i + 1) / samples) * 20}%`;
      }

      const avg = times.reduce((a, b) => a + b, 0) / times.length;
      let jitterSum = 0;
      for (let i = 1; i < times.length; i++) {
        jitterSum += Math.abs(times[i] - times[i - 1]);
      }
      const jitter = jitterSum / (times.length - 1);

      $("ping-res").textContent = `${avg.toFixed(1)} ms`;
      $("jitter-res").textContent = `${jitter.toFixed(1)} ms`;
    }

    async function measureDownload(durationMs = 8000, streams = 4) {
      $("phase").textContent = "DOWNLOAD";
      $("live-unit").textContent = "Mbps";
      let totalBytes = 0;
      const startTime = performance.now();
      let active = true;

      const worker = async (id) => {
        while (active) {
          const controller = new AbortController();
          const res = await fetch(`/api/speed?mode=down&mb=50&s=${id}-${Date.now()}`, {
            cache: "no-store",
            signal: controller.signal,
          });
          const reader = res.body.getReader();
          try {
            while (active) {
              const { done, value } = await reader.read();
              if (done) break;
              totalBytes += value.byteLength;
              if (performance.now() - startTime >= durationMs) {
                active = false;
                controller.abort();
                break;
              }
            }
          } catch {}
        }
      };

      const ticker = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        if (elapsed > 0.2) {
          const mbps = (totalBytes * 8) / (elapsed * 1_000_000);
          $("live-speed").textContent = mbps.toFixed(1);
          const pct = Math.min(elapsed / (durationMs / 1000), 1);
          $("progress").style.width = `${20 + pct * 40}%`;
        }
      }, 100);

      await Promise.all(Array.from({ length: streams }, (_, i) => worker(i)));
      clearInterval(ticker);

      const totalSec = (performance.now() - startTime) / 1000;
      const finalMbps = (totalBytes * 8) / (totalSec * 1_000_000);
      $("live-speed").textContent = finalMbps.toFixed(1);
      $("dl-res").textContent = `${finalMbps.toFixed(1)} Mbps`;
    }

    async function measureUpload(durationMs = 8000, streams = 3) {
      $("phase").textContent = "UPLOAD";
      $("live-unit").textContent = "Mbps";
      let totalBytes = 0;
      const startTime = performance.now();
      const payloadSize = 2 * 1024 * 1024; // 2MB chunks per POST
      const payload = new Uint8Array(payloadSize);
      crypto.getRandomValues(payload.subarray(0, 65536));

      const worker = async (id) => {
        while (performance.now() - startTime < durationMs) {
          const res = await fetch(`/api/speed?mode=up&s=${id}-${Date.now()}`, {
            method: "POST",
            body: payload,
            cache: "no-store",
          });
          if (res.ok) {
            totalBytes += payloadSize;
          }
        }
      };

      const ticker = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        if (elapsed > 0.2) {
          const mbps = (totalBytes * 8) / (elapsed * 1_000_000);
          $("live-speed").textContent = mbps.toFixed(1);
          const pct = Math.min(elapsed / (durationMs / 1000), 1);
          $("progress").style.width = `${60 + pct * 40}%`;
        }
      }, 100);

      await Promise.all(Array.from({ length: streams }, (_, i) => worker(i)));
      clearInterval(ticker);

      const totalSec = (performance.now() - startTime) / 1000;
      const finalMbps = (totalBytes * 8) / (totalSec * 1_000_000);
      $("live-speed").textContent = finalMbps.toFixed(1);
      $("ul-res").textContent = `${finalMbps.toFixed(1)} Mbps`;
    }

    async function runTest() {
      const btn = $("start-btn");
      btn.disabled = true;
      btn.textContent = "TESTING...";
      $("dl-res").textContent = "— Mbps";
      $("ul-res").textContent = "— Mbps";
      $("ping-res").textContent = "— ms";
      $("jitter-res").textContent = "— ms";
      $("progress").style.width = "0%";

      try {
        await measurePing();
        await measureDownload();
        await measureUpload();
        $("phase").textContent = "COMPLETE";
      } catch (err) {
        $("phase").textContent = "ERROR — RETRY";
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "RUN AGAIN";
      }
    }
  </script>
</body>
</html>
